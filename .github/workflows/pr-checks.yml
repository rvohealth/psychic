name: PR Checks
on:
  - pull_request

permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  check-cooldown-excludes:
    name: Cooldown exclude allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: minimumReleaseAgeExclude must be @rvoh/* only
        run: |
          # SECURITY: the minimumReleaseAge cooldown bypass list must stay @rvoh/*
          # only (our own packages). Any third-party entry is a permanent
          # supply-chain bypass and must be rejected — apply urgent patches via a
          # transient, reverted override instead of a persistent exclude.
          #
          # pnpm 11+ enforces the list it reads from pnpm-workspace.yaml (block or
          # inline list form) in the root and in client/ (which has its own
          # lockfile and does not inherit the root settings). pnpm ignores the
          # setting in .npmrc; .npmrc is still checked so a stale copy cannot
          # reappear there.
          bad=$(grep -nE '^[[:space:]]*minimumReleaseAgeExclude' .npmrc | grep -vE '=[[:space:]]*@rvoh/' | sed 's/^/.npmrc:/' || true)
          bad_yaml=$(awk '
            FNR == 1 { inblock = 0 }
            /^minimumReleaseAgeExclude:/ {
              inblock = 1
              rest = $0; sub(/^[^:]*:[[:space:]]*/, "", rest)
              if (rest != "") { n = split(rest, parts, ","); for (i = 1; i <= n; i++) emit(FILENAME, FNR, parts[i]) }
              next
            }
            inblock && /^[^[:space:]#]/ { inblock = 0 }
            inblock && /^[[:space:]]*-/ { text = $0; sub(/^[[:space:]]*-[[:space:]]*/, "", text); emit(FILENAME, FNR, text) }
            function emit(file, line, text) { gsub("[^[:alnum:]@/._-]", "", text); if (text != "") print file ":" line ": " text }
          ' pnpm-workspace.yaml client/pnpm-workspace.yaml | grep -vE '^[^:]+:[0-9]+: @rvoh/' || true)
          if [ -n "$bad$bad_yaml" ]; then
            echo "::error::Non-@rvoh minimumReleaseAgeExclude entries (cooldown bypass must stay @rvoh/* only):"
            [ -n "$bad" ] && echo "$bad"
            [ -n "$bad_yaml" ] && echo "$bad_yaml"
            exit 1
          fi

  uspec:
    name: Unit tests (Node ${{ matrix.node-version }})
    strategy:
      matrix:
        node-version: ["26", "24", "25"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      PSYCHIC_UNIT_MAX_WORKERS: 1
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - run: corepack enable
      - run: go install github.com/oasdiff/oasdiff@latest
      - run: oasdiff --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm uspec

  fspec:
    name: Feature tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: install client packages
        run: pnpm install --frozen-lockfile
        working-directory: ./client

      - name: install puppeteer browsers
        run: pnpm puppeteer browsers install firefox

      - name: make screenshots dir
        run: mkdir -p /tmp/screenshots

      - name: reset database
        run: pnpm psy db:reset

      - name: prepare parallel test databases
        run: pnpm psy db:migrate --skip-sync

      - name: run feature specs
        run: pnpm fspec

      - name: Archive screenshots
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: Feature spec screenshots
          path: /tmp/screenshots

  lint:
    name: Linting
    strategy:
      matrix:
        node-version: ["26", "24"]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build
    strategy:
      matrix:
        node-version: ["26", "24"]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:test-app

  check-no-sync-diff:
    name: Ensure no sync diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      CI: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm psy sync
      - name: Check for sync differences
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Error: 'pnpm psy sync' produced changes. Please run 'pnpm psy sync' locally and commit the changes."
            echo "Changes detected:"
            git diff
            exit 1
          else
            echo "No changes detected after sync - all good!"
          fi
