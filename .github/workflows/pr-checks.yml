name: PR Checks
on:
  - pull_request

permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  check-cooldown-excludes:
    name: Cooldown exclude allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable

      - name: minimumReleaseAge is set and minimumReleaseAgeExclude is @rvoh/* only
        run: |
          # SECURITY: the minimumReleaseAge cooldown bypass list must stay @rvoh/*
          # only (our own packages). Any third-party entry is a permanent
          # supply-chain bypass and must be rejected — apply urgent patches via a
          # transient, reverted override instead of a persistent exclude.
          #
          # pnpm 11+ reads both settings only from pnpm-workspace.yaml, in the
          # root and in client/ (which has its own lockfile and does not inherit
          # the root settings). Ask the pinned pnpm what it actually resolved
          # rather than pattern-matching the YAML, so every spelling pnpm accepts
          # (quoted keys, flow or block lists) is checked, and a file pnpm cannot
          # parse fails the job. pnpm ignores these settings in .npmrc; .npmrc is
          # still checked so a stale copy cannot reappear there.
          status=0
          for dir in . client; do
            if ! age=$(cd "$dir" && pnpm config get minimumReleaseAge --json) ||
              ! exclude=$(cd "$dir" && pnpm config get minimumReleaseAgeExclude --json); then
              echo "::error::pnpm could not read the configuration in $dir"
              status=1
              continue
            fi
            DIR="$dir" AGE="$age" EXCLUDE="$exclude" node -e '
              const { DIR, AGE, EXCLUDE } = process.env
              const age = JSON.parse(AGE)
              const exclude = JSON.parse(EXCLUDE) ?? []
              let ok = true
              if (!Number.isInteger(age) || age <= 0) {
                console.log(`::error::${DIR}/pnpm-workspace.yaml must set a positive minimumReleaseAge (pnpm resolved ${AGE})`)
                ok = false
              }
              const entries = Array.isArray(exclude) ? exclude : [exclude]
              const bad = entries.filter((entry) => typeof entry !== "string" || !entry.startsWith("@rvoh/"))
              if (bad.length > 0) {
                console.log(`::error::Non-@rvoh minimumReleaseAgeExclude entries in ${DIR}/pnpm-workspace.yaml (cooldown bypass must stay @rvoh/* only): ${JSON.stringify(bad)}`)
                ok = false
              }
              process.exit(ok ? 0 : 1)
            ' || status=1
          done
          bad_npmrc=$(grep -nE '^[[:space:]]*minimumReleaseAgeExclude' .npmrc | grep -vE '=[[:space:]]*@rvoh/' | sed 's/^/.npmrc:/' || true)
          if [ -n "$bad_npmrc" ]; then
            echo "::error::Non-@rvoh minimumReleaseAgeExclude entries (cooldown bypass must stay @rvoh/* only):"
            echo "$bad_npmrc"
            status=1
          fi
          exit $status

  uspec:
    name: Unit tests (Node ${{ matrix.node-version }})
    strategy:
      matrix:
        node-version: ["26", "24", "25"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      PSYCHIC_UNIT_MAX_WORKERS: 1
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - run: corepack enable
      - run: go install github.com/oasdiff/oasdiff@latest
      - run: oasdiff --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm uspec

  fspec:
    name: Feature tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: install client packages
        run: pnpm install --frozen-lockfile
        working-directory: ./client

      - name: install puppeteer browsers
        run: pnpm puppeteer browsers install firefox

      - name: make screenshots dir
        run: mkdir -p /tmp/screenshots

      - name: reset database
        run: pnpm psy db:reset

      - name: prepare parallel test databases
        run: pnpm psy db:migrate --skip-sync

      - name: run feature specs
        run: pnpm fspec

      - name: Archive screenshots
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: Feature spec screenshots
          path: /tmp/screenshots

  lint:
    name: Linting
    strategy:
      matrix:
        node-version: ["26", "24"]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build
    strategy:
      matrix:
        node-version: ["26", "24"]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:test-app

  check-no-sync-diff:
    name: Ensure no sync diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.COLUMN_ENCRYPTION_KEY }}
      DREAM_PARALLEL_TESTS: 4
      CI: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm psy sync
      - name: Check for sync differences
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Error: 'pnpm psy sync' produced changes. Please run 'pnpm psy sync' locally and commit the changes."
            echo "Changes detected:"
            git diff
            exit 1
          else
            echo "No changes detected after sync - all good!"
          fi
